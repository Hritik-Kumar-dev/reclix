[package]
name        = "reclix-service"
description = "Reclix background service: D-Bus API, capture orchestration, systemd user service"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[[bin]]
name = "reclix-service"
path = "src/main.rs"

[features]
default = []
# Enable on systems with libpipewire-0.3-dev installed:
full = [
    "reclix-capture/pipewire-capture",
    "reclix-audio/pipewire-audio",
]

[dependencies]
reclix-core    = { path = "../reclix-core" }
reclix-capture = { path = "../reclix-capture", default-features = false }
reclix-audio   = { path = "../reclix-audio",   default-features = false }
reclix-encode  = { path = "../reclix-encode" }
reclix-tray    = { path = "../reclix-tray" }

tokio          = { workspace = true }
tokio-stream   = { workspace = true }
anyhow         = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
chrono         = { workspace = true }
uuid           = { workspace = true }
dirs           = { workspace = true }
parking_lot    = { workspace = true }
async-channel  = { workspace = true }

# D-Bus
zbus           = { workspace = true }
zvariant       = { workspace = true }

# XDG portals (GlobalShortcuts) — needed even without PipeWire
ashpd          = { workspace = true }

# futures
futures-util   = { workspace = true }

# tray handle type
ksni           = { workspace = true }
