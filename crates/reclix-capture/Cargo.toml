[package]
name        = "reclix-capture"
description = "XDG portal + PipeWire screen capture for Reclix"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true

[features]
default  = ["pipewire-capture"]
# Disable to build without libpipewire-0.3-dev (e.g. in CI without system deps)
pipewire-capture = ["pipewire", "ashpd"]

[dependencies]
reclix-core = { path = "../reclix-core" }

tokio       = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
serde       = { workspace = true }
parking_lot = { workspace = true }

# Optional: only compiled when libpipewire-0.3-dev is present
ashpd       = { workspace = true, optional = true }
pipewire    = { workspace = true, optional = true }
