[workspace]
resolver = "2"
members = [
    "crates/reclix-core",
    "crates/reclix-capture",
    "crates/reclix-audio",
    "crates/reclix-encode",
    "crates/reclix-service",
    "crates/reclix-tray",
    "crates/reclix-cli",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "GPL-3.0-or-later"
authors    = ["Reclix Contributors"]
repository = "https://github.com/reclix/reclix"
rust-version = "1.75"

[workspace.dependencies]
# async runtime
tokio          = { version = "1.37", features = ["full"] }
tokio-stream   = "0.1"

# serialisation
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"

# logging / tracing
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# error handling
anyhow         = "1"
thiserror      = "1"

# async channel / notify
async-channel  = "2"
notify         = "6"

# D-Bus (zbus — pure-Rust, async-native)
zbus           = { version = "4", features = ["tokio"] }
zvariant       = "4"

# XDG Desktop Portals (ScreenCast, GlobalShortcuts)
ashpd          = { version = "0.9", features = ["tokio"] }

# PipeWire Rust bindings
pipewire       = "0.8"

# GTK / libadwaita (only for service / tray overlay)
gtk4           = { version = "0.8", features = ["v4_12"] }
libadwaita     = { version = "0.6", features = ["v1_4"] }

# Tray / StatusNotifierItem
ksni           = "0.2"

# CLI
clap           = { version = "4", features = ["derive", "env"] }

# time
chrono         = { version = "0.4", features = ["serde"] }
time           = { version = "0.3", features = ["serde"] }

# directories
dirs           = "5"

# uuid
uuid           = { version = "1", features = ["v4", "serde"] }

# once_cell
once_cell      = "1"

# parking_lot
parking_lot    = "0.12"

[profile.release]
lto            = "thin"
codegen-units  = 1
strip          = "symbols"
opt-level      = 3
